- drpEqPosicao:
    Control: Classic/DropDown@2.3.1
    Properties:
      Items: |-
        =With(
            {wMalha: Substitute(gblEquip.Descricao, "Peneira ", "Malha ")},
            With(
                {wMesma: Filter(colPontos, Ensaio = "PEN" && wMalha in Parametro)},
                ForAll(If(CountRows(wMesma) > 0, wMesma, Filter(colPontos, Ensaio = "PEN")), Parametro & "  ·  atual: " & Coalesce(TAG, "vazia"))
            )
        )
      X: =44
      Y: =494
      Width: =Parent.Width - 88
      Height: =54
      Size: =14
      BorderColor: =RGBA(205, 214, 225, 1)
      Visible: =locInstalar
