    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      X: =0
      Y: =Parent.Height - 104
      Width: =Parent.Width
      Height: =104
      BorderColor: =RGBA(225, 231, 238, 1)
      BorderThickness: =1
      Visible: =!IsBlank(gblEquip)
- btnEqLancar:
    Control: Classic/Button@2.2.0
    Properties:
      Text: =If(CountRows(gblCodigos) >= 2, If(First(gblCodigos).Value = "PEN", "Verificar peneiras", "Lançar " & LookUp(colEnsaios, Title = First(gblCodigos).Value).Nome), If(First(gblCodigos).Value = "PEN", "Verificar as peneiras do " & Coalesce(LookUp(colEquip, Title = gblConjuntoRef).Descricao, "peneirador"), "Lançar " & LookUp(colEnsaios, Title = First(gblCodigos).Value).Nome))
      X: =20
      Y: =Parent.Height - 88
      Width: =If(CountRows(gblCodigos) >= 2, (Parent.Width - 50) / 2, Parent.Width - 40)
      Height: =70
      OnSelect: |-
        =With(
            {wCod: First(gblCodigos).Value},
            Set(gblEnsaio, LookUp(colEnsaios, Title = wCod));
            Set(gblConjuntoFiltro, If(wCod = "PEN", gblConjuntoRef, ""));
            Set(gblDestacar, If(wCod = "PEN", If(gblEhPeneira, gblEquip.Title, ""), gblEquip.Title))
        );
        Navigate(If(gblEnsaio.Formulario.Value = "Checklist", scrVerificacao, scrEnsaio), ScreenTransition.Cover)
      Fill: =RGBA(11, 37, 64, 1)
      Color: =RGBA(255, 255, 255, 1)
      Size: =If(CountRows(gblCodigos) >= 2, 13, 15)
      FontWeight: =FontWeight.Bold
      HoverFill: =RGBA(11, 37, 64, 1)
      PressedFill: =RGBA(11, 37, 64, 1)
      HoverColor: =RGBA(255, 255, 255, 1)
      PressedColor: =RGBA(255, 255, 255, 1)
      RadiusTopLeft: =12
      RadiusTopRight: =12
      RadiusBottomLeft: =12
      RadiusBottomRight: =12
      Visible: =!IsBlank(gblEquip) && gblPerfil = "Laboratorista" && CountRows(gblCodigos) >= 1
