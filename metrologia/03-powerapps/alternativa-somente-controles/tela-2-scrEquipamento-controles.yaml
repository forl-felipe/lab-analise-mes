            ""
        ) &
        If(
            gblEhPeneirador,
            "  ·  " & CountRows(colPeneirasConj) & " posições  ·  " &
            CountIf(colPeneirasConj, StartsWith(StatusPen, "Bloqueado")) & " peneira(s) bloqueada(s)",
