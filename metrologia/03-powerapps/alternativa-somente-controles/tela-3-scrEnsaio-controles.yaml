          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            X: =0
            Y: =0
            Width: =Parent.TemplateWidth
            Height: =Parent.TemplateHeight - 10
            BorderColor: =If(!IsBlank(gblDestacar) && ThisItem.TAG = gblDestacar, RGBA(14, 107, 168, 1), RGBA(225, 231, 238, 1))
            BorderThickness: =If(!IsBlank(gblDestacar) && ThisItem.TAG = gblDestacar, 3, 1)
      - lblPtTitulo:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =Switch(
                  ThisItem.EntradaTxt,
                  "Massa", "Fração " & ThisItem.Parametro,
                  "Comparativo", ThisItem.Parametro,
                  Coalesce(ThisItem.TAG, ThisItem.EquipamentoBD) & If(IsBlank(ThisItem.Secao), "", " · " & ThisItem.Secao)
              )
            X: =14
            Y: =8
            Width: =Parent.TemplateWidth - 200
            Height: =32
            Size: =14
            FontWeight: =FontWeight.Bold
            Color: =RGBA(11, 37, 64, 1)
      - lblPtSub:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =If(ThisItem.EntradaTxt in ["Massa", "Comparativo"], ThisItem.EquipamentoBD, ThisItem.Parametro) &
              If(ThisItem.EntradaTxt = "Tempo", " · " & ThisItem.Fator & " voltas", "") & " · " &
              If(
                  ThisItem.EntradaTxt = "Massa", ThisItem.RotuloA & " e " & ThisItem.RotuloB,
                  !IsBlank(ThisItem.LI) || !IsBlank(ThisItem.LS),
                      "Limites " & Coalesce(Text(ThisItem.LI), "—") & " a " & Coalesce(Text(ThisItem.LS), "—") & " " & ThisItem.Unidade,
                  !IsBlank(ThisItem.Tol), "Diferença até ± " & Text(ThisItem.Tol) & " " & ThisItem.Unidade,
                  "Informativo"
              )
            X: =14
            Y: =40
            Width: =Parent.TemplateWidth - 28
            Height: =30
            Size: =11
            Color: =RGBA(93, 107, 125, 1)
      - txtPtA:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: =""
            HintText: =Coalesce(ThisItem.RotuloA, "Valor")
            X: =14
            Y: =76
            Width: =If(ThisItem.EntradaTxt in ["Tempo", "Comparativo", "Massa"], (Parent.TemplateWidth - 38) / 2, Parent.TemplateWidth - 28)
            Height: =54
            Size: =17
            BorderColor: =RGBA(205, 214, 225, 1)
            RadiusTopLeft: =10
            RadiusTopRight: =10
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            Format: =TextFormat.Text
            Align: =Align.Center
            FontWeight: =FontWeight.Bold
      - txtPtB:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: =""
            HintText: =Coalesce(ThisItem.RotuloB, "Valor")
            X: =24 + (Parent.TemplateWidth - 38) / 2
            Y: =76
            Width: =(Parent.TemplateWidth - 38) / 2
            Height: =54
            Size: =17
            BorderColor: =RGBA(205, 214, 225, 1)
            RadiusTopLeft: =10
            RadiusTopRight: =10
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            Align: =Align.Center
            FontWeight: =FontWeight.Bold
            Visible: =ThisItem.EntradaTxt in ["Tempo", "Comparativo", "Massa"]
      - lblPtV:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =With(
                  {a: Value(txtPtA.Text), b: Value(txtPtB.Text)},
                  With(
                      {
                          v: Switch(
                              ThisItem.EntradaTxt,
                              "Tempo", If(Coalesce(a, 0) * 60 + Coalesce(b, 0) > 0 && !IsBlank(ThisItem.Fator), ThisItem.Fator * 60 / (Coalesce(a, 0) * 60 + Coalesce(b, 0))),
                              "Massa", Blank(),
                              a
                          )
                      },
                      If(IsBlank(v), "", Text(v, "0.##########", "en-US"))
                  )
              )
            X: =0
            Y: =0
            Width: =10
            Height: =10
            Size: =13
            Color: =RGBA(23, 35, 52, 1)
            Visible: =False
      - lblPtRef:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =With(
                  {r: Switch(ThisItem.EntradaTxt, "Comparativo", Value(txtPtB.Text), "ComparativoReferencia", Value(lblEnEstufaValor.Text, "en-US"), ThisItem.Nom)},
                  If(IsBlank(r), "", Text(r, "0.##########", "en-US"))
              )
            X: =0
            Y: =0
            Width: =10
            Height: =10
            Size: =13
            Color: =RGBA(23, 35, 52, 1)
            Visible: =False
      - lblPtRes:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =With(
                  {v: Value(lblPtV.Text, "en-US"), r: Value(lblPtRef.Text, "en-US")},
                  If(
                      IsBlank(v), "",
                      !IsBlank(ThisItem.LI) || !IsBlank(ThisItem.LS),
                          If((IsBlank(ThisItem.LI) || v >= ThisItem.LI) && (IsBlank(ThisItem.LS) || v <= ThisItem.LS), "Conforme", "Não conforme"),
                      !IsBlank(ThisItem.Tol),
                          If(IsBlank(r), "", If(Round(Abs(v - r), 6) <= Round(ThisItem.Tol, 6), "Conforme", "Não conforme")),
                      "Informativo"
                  )
              )
            X: =Parent.TemplateWidth - 186
            Y: =10
            Width: =172
            Height: =30
            Size: =10
            FontWeight: =FontWeight.Bold
            Color: =If(Self.Text = "Conforme", RGBA(30, 127, 79, 1), Self.Text = "Não conforme", RGBA(180, 35, 24, 1), RGBA(85, 98, 116, 1))
            Align: =Align.Center
            Fill: =If(Self.Text = "Conforme", RGBA(226, 243, 234, 1), Self.Text = "Não conforme", RGBA(253, 236, 235, 1), RGBA(236, 239, 243, 1))
            Visible: =!IsBlank(Self.Text)
      - lblPtCalc:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =With(
                  {v: Value(lblPtV.Text, "en-US"), r: Value(lblPtRef.Text, "en-US")},
                  If(
                      IsBlank(v), "",
                      If(ThisItem.EntradaTxt = "Tempo", "Rotação " & Text(v, "0.00") & " rpm   ", "") &
                      If(IsBlank(r), "", "Diferença " & Text(v - r, "0.###"))
                  )
              )
            X: =14
            Y: =134
            Width: =Parent.TemplateWidth - 28
            Height: =30
            Size: =12
            FontWeight: =FontWeight.Bold
            Color: =RGBA(23, 35, 52, 1)
