- btnVeRevisar:
    Control: Classic/Button@2.2.0
    Properties:
      Text: ="Revisar e enviar"
      X: =Parent.Width - 240
      Y: =Parent.Height - 88
      Width: =220
      Height: =70
      OnSelect: |-
        =ClearCollect(
            colResultados,
            ForAll(
                Filter(colFormVe, (locGrupo = "Todos" || Secao = locGrupo)) As pe,
                With(
                    {
                        itens: Table(
                            {n: "Condições das telas", v: pe.I1}, {n: "Inclinação das telas", v: pe.I2}, {n: "Vibração do peneirador", v: pe.I3}, {n: "Travamento das peneiras", v: pe.I4}, {n: "Calibração", v: pe.I5}
                        )
                    },
                    {
                        Equipamento: pe.EquipamentoBD, TAG: pe.TAG, Parametro: pe.Parametro, Unidade: "itens OK", Tipo: pe.TipoTxt,
                        Valor: CountRows(Filter(itens, v = "OK")), Referencia: CountRows(itens),
                        Diferenca: If(false, 0), LI: If(false, 0), LS: If(false, 0), Tol: If(false, 0),
                        Resultado: If(CountRows(Filter(itens, v = "NÃO OK")) > 0, "Não conforme", "Conforme"),
                        ItensNaoOK: Concat(Filter(itens, v = "NÃO OK"), n, "; "),
                        ObsItem: Concat(
                            Filter(
                                Table(
                                    {t: Concat(Filter(itens, v = "NÃO OK"), n, "; ")},
                                    {t: If(CountRows(Filter(itens, v = "SEM TAG")) > 0, "Sem TAG de calibração", "")}
                                ),
                                !IsBlank(t)
                            ),
                            t,
                            "; "
                        )
                    }
                )
            )
        );
        Set(gblNC, CountRows(Filter(colResultados, Resultado = "Não conforme")));
        UpdateContext({locRevisar: true})
      Fill: =RGBA(11, 37, 64, 1)
      Color: =RGBA(255, 255, 255, 1)
      Size: =15
      FontWeight: =FontWeight.Bold
      HoverFill: =RGBA(11, 37, 64, 1)
      PressedFill: =RGBA(11, 37, 64, 1)
      HoverColor: =RGBA(255, 255, 255, 1)
      PressedColor: =RGBA(255, 255, 255, 1)
      RadiusTopLeft: =12
      RadiusTopRight: =12
      RadiusBottomLeft: =12
      RadiusBottomRight: =12
      DisplayMode: =If(gblPerfil = "Laboratorista", DisplayMode.Edit, DisplayMode.Disabled)
