            X: =20
            Y: =If(gblPerfil = "Colaborador", 176, If(gblPerfil = "Laboratorista", 272, 236)) + 88
            Width: =Parent.Width - 40
            Height: =52
            Size: =15
            BorderColor: =RGBA(205, 214, 225, 1)
            RadiusTopLeft: =10
            RadiusTopRight: =10
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            Visible: =locAba = "equip"
      - galIniEquip:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Items: |-
              =Sort(
                  Filter(
                      colEquip,
                      (locFiltro = "" ||
                          (locFiltro = "bloq" && StartsWith(StatusCalc, "Bloqueado")) ||
                          (locFiltro = "lib" && StartsWith(StatusCalc, "Liberado")) ||
                          (locFiltro = "vence" && StatusCalc = "Liberado · Calibração vence em breve")) &&
                      (IsBlank(txtIniBusca.Text) || txtIniBusca.Text in Title || txtIniBusca.Text in Descricao || txtIniBusca.Text in Grupo)
                  ),
                  If(StartsWith(StatusCalc, "Bloqueado"), "0", "1") & Title
              )
            X: =20
            Y: =If(gblPerfil = "Colaborador", 176, If(gblPerfil = "Laboratorista", 272, 236)) + 150
            Width: =Parent.Width - 40
            Height: =Parent.Height - (If(gblPerfil = "Colaborador", 176, If(gblPerfil = "Laboratorista", 272, 236))) - 160
            TemplateSize: =92
            TemplatePadding: =0
            TemplateFill: =RGBA(0, 0, 0, 0)
            OnSelect: =Set(gblTag, ThisItem.Title); Navigate(scrEquipamento, ScreenTransition.Cover)
            Visible: =locAba = "equip"
          Children:
